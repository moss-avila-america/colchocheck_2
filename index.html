  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --navy: #102238;
      --navy2: #1b3651;
      --accent: #2c75ac;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --line: #e5eaf0;
      --ink: #182334;
      --muted: #6b7b8f;
      --success: #17754e;
      --warning: #a26917;
      --danger: #b63e4c;
      --radius: 18px;
      --shadow: 0 12px 35px rgba(19,34,53,.055);
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      font: 14px/1.48 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .42; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #7db8e9;
      outline-offset: 2px;
    }
    a { color: #2569a2; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .micro { font-size: 11px; }
    .bold { font-weight: 750; }
    .caps { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; }
    .line { border-top: 1px solid var(--line); }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .view { width: min(1220px, 100%); margin: auto; padding: 24px 22px 100px; }
    .card { border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .pad { padding: 22px; }
    .g12 { display: grid; gap: 12px; }
    .g18 { display: grid; gap: 18px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .flex { display: flex; }
    .between { justify-content: space-between; }
    .center { align-items: center; }
    .wrap { flex-wrap: wrap; }
    .gap8 { gap: 8px; }
    .gap12 { gap: 12px; }
    .btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-weight: 750;
      white-space: normal;
      text-align: center;
      line-height: 1.25;
      transition: all .15s ease;
    }
    .btn.primary { background: var(--navy); color: white; }
    .btn.primary:hover { background: var(--navy2); }
    .btn.green { background: #168154; color: white; }
    .btn.red { background: #b94551; color: white; }
    .btn.soft { background: #eff4f8; color: #294862; }
    .btn.ghost { background: white; color: #33475c; border-color: #dce4ec; }
    .btn.amber { background: #fff4df; color: #905f16; border-color: #ead7b0; }
    .btn.small { min-height: 34px; padding: 7px 11px; font-size: 12px; }
    .btn.wide { width: 100%; }
    .field {
      width: 100%;
      min-height: 45px;
      padding: 11px 13px;
      border: 1px solid #d4dfe9;
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
    }
    .field:disabled { background: #f3f6f8; }
    .field.textarea { min-height: 90px; resize: vertical; }
    .field-label { font-size: 11px; text-transform: uppercase; font-weight: 800; letter-spacing: .035em; display: block; margin-bottom: 6px; color: #3a4b60; }
    .field-help { font-size: 11px; color: var(--muted); margin-top: 5px; }
    .formgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .stat { padding: 17px 20px; }
    .stat b { display: block; font-size: 25px; letter-spacing: -.04em; line-height: 1.2; margin-top: 5px; }
    .chip {
      border-radius: 999px;
      padding: 5px 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.2;
      background: #edf1f5;
      color: #566575;
      max-width: 100%;
    }
    .chip.green { background: #e7f6ee; color: #167147; }
    .chip.amber { background: #fff2da; color: #8f5e1a; }
    .chip.blue { background: #e8f1fa; color: #2c6194; }
    .chip.red { background: #fee9eb; color: #ad3845; }
    .chip.black { background: #172b44; color: #fff; }
    .note { font-size: 12px; background: #f1f6fa; color: #3e5b73; border: 1px solid #dceaf2; border-radius: 12px; padding: 12px 14px; line-height: 1.55; }
    .note.warn { background: #fff6e5; border-color: #f4e4bb; color: #845b1d; }
    .note.danger { background: #fff0f0; border-color: #f3d4d6; color: #ad3845; }
    .note.ok { background: #eff9f3; border-color: #d4ebdf; color: #276649; }
    .sp16 { margin-top: 16px; }
    .sp12 { margin-top: 12px; }
    .sp8 { margin-top: 8px; }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .item { padding: 14px 0; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: 0; padding-bottom: 0; }
    .item:first-child { padding-top: 0; }
    .item-main { min-width: 0; flex: 1; }
    .item-title { font-weight: 760; overflow-wrap: anywhere; }
    .item-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .table-scroll { overflow: auto; }
    .data-table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 12px; }
    .data-table td, .data-table th { border-bottom: 1px solid var(--line); padding: 11px 13px; text-align: left; vertical-align: middle; }
    .data-table th { background: #f7f9fb; font-size: 10px; text-transform: uppercase; color: #62748a; letter-spacing: .045em; }
    .data-table tr:last-child td { border-bottom: 0; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin: 0 0 20px; }
    .head h1 { font-size: 25px; letter-spacing: -.04em; line-height: 1.15; margin: 4px 0 6px; }
    .head p { margin: 0; color: var(--muted); font-size: 13px; }
    .section-title { font-size: 15px; letter-spacing: -.02em; margin: 0 0 10px; font-weight: 800; }
    .divider { border-top: 1px solid var(--line); margin: 17px 0; }
    .empty { color: var(--muted); font-size: 13px; padding: 26px; text-align: center; border: 1px dashed #d5e1ea; border-radius: 12px; background: #fafbfd; }
    .loginShell { min-height: 100vh; display: grid; grid-template-columns: minmax(260px, .88fr) minmax(360px, 1fr); }
    .loginSide { background: var(--navy); color: #fff; padding: 54px clamp(28px, 6vw, 84px); display: flex; flex-direction: column; justify-content: space-between; }
    .loginSide h2 { font-size: clamp(30px, 3.4vw, 48px); letter-spacing: -.04em; line-height: 1.08; margin: 26px 0 14px; }
    .loginSide p { max-width: 450px; color: #c3d2e0; font-size: 15px; }
    .loginStage { padding: 20px; display: flex; align-items: center; justify-content: center; }
    .loginCard { background: #fff; border-radius: 24px; border: 1px solid var(--line); padding: 32px; width: min(450px, 100%); box-shadow: 0 18px 50px rgba(18,38,59,.09); }
    .appLogo { border-radius: 50%; object-fit: cover; box-shadow: 0 6px 16px rgba(0,0,0,.18); background: #102238; }
    .loginCard h1 { font-size: 24px; letter-spacing: -.04em; margin: 14px 0 0; }
    .loginCard .tag { font-size: 11px; color: #176497; font-weight: 800; letter-spacing: .08em; margin-top: 2px; }
    .loginCard .subtitle { color: #6c7c8f; font-size: 13px; margin: 6px 0 24px; }
    .appHeader { background: var(--navy); color: white; min-height: 72px; display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; gap: 15px; position: sticky; top: 0; z-index: 30; }
    .headerBrand { display: flex; gap: 12px; align-items: center; }
    .headerBrand .brand-name { font-size: 17px; font-weight: 850; letter-spacing: -.03em; }
    .headerBrand .sub { font-size: 11px; color: #c8d6e3; }
    .headerRight { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .demoBar { background: #091524; color: #f8fafc; padding: 8px 20px; font-size: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid #243b55; }
    .tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
    .tab { background: #fff; border: 1px solid #dfe7ee; color: #39526a; padding: 10px 14px; border-radius: 11px; font-weight: 710; font-size: 12px; }
    .tab.active { background: #142941; color: #fff; border-color: #142941; }
    .bigTimer { background: #142941; border-radius: 17px; padding: 20px; color: white; text-align: center; }
    .bigTimer .time { font-size: clamp(30px, 4vw, 44px); font-weight: 850; font-variant-numeric: tabular-nums; letter-spacing: .05em; margin: 5px 0; }
    .bigTimer .tiny { font-size: 11px; color: #c5d7e9; }
    .actionGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actionGrid .btn { min-height: 64px; font-size: 14px; }
    .progress { height: 8px; background: #263e57; border-radius: 99px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: #38bdf8; border-radius: 99px; }
    .toast { position: fixed; bottom: 20px; right: 20px; z-index: 95; background: #14263a; color: white; box-shadow: 0 15px 35px #0003; padding: 14px 18px; border-radius: 12px; max-width: 360px; font-size: 13px; font-weight: 600; }
    .overlay { position: fixed; inset: 0; z-index: 80; background: #0b1828bb; display: flex; align-items: center; justify-content: center; padding: 15px; }
    .modal { background: #fff; border-radius: 20px; width: min(610px, 100%); max-height: 93vh; overflow: auto; padding: 24px; box-shadow: 0 25px 65px #0005; }
    .modal h2 { margin: 0 0 9px; font-size: 19px; }
    .proof-preview { max-width: 100%; width: 100%; max-height: 300px; object-fit: contain; border-radius: 13px; background: #0a1c31; border: 1px solid #e4eaf0; }
    .camera-frame { background: #0c1c2e; border-radius: 13px; overflow: hidden; position: relative; margin: 12px 0; }
    .camera-frame video { width: 100%; max-height: 300px; display: block; object-fit: cover; }
    .pill-btns { display: flex; gap: 7px; flex-wrap: wrap; }
    .user-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; gap: 10px; border-bottom: 1px solid #edf1f4; }
    .user-row:last-child { border-bottom: 0; }
    .appFooter { font-size: 11px; color: #84909f; margin-top: 35px; text-align: center; }
    .soft-divider { height: 1px; background: var(--line); margin: 14px 0; }
    .warranty-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .warranty-slot { padding: 10px; border-radius: 11px; border: 1px solid #d4dfe9; background: #f8fafc; text-align: left; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; justify-content: space-between; min-height: 76px; }
    .warranty-slot.done { border-color: #168154; background: #eff9f3; color: #14593a; }
    @media(max-width:900px) {
      .loginShell { grid-template-columns: 1fr; }
      .loginSide { display: none; }
      .two { grid-template-columns: 1fr; }
      .three { grid-template-columns: repeat(2, 1fr); }
      .four { grid-template-columns: repeat(2, 1fr); }
      .view { padding: 18px 14px 90px; }
    }
    @media(max-width:540px) {
      .appHeader { padding: 10px 12px; }
      .headerBrand .sub { display: none; }
      .headerRight .hideMobile { display: none; }
      .view { padding: 16px 11px 100px; }
      .card.pad { padding: 17px; }
      .loginCard { padding: 25px 20px; }
      .head h1 { font-size: 22px; }
      .four { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .three, .formgrid { grid-template-columns: 1fr; }
      .warranty-grid { grid-template-columns: repeat(2, 1fr); }
      .actionGrid .btn { min-height: 61px; font-size: 13px; }
      .modal { padding: 18px; }
      .item { flex-wrap: wrap; }
    }
  </style>

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = d => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    async function hashPass(pass, salt) {
      const enc = new TextEncoder();
      let key = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
      let buf = await crypto.subtle.deriveBits({
        name: 'PBKDF2',
        salt: Uint8Array.from(salt.match(/.{2}/g).map(x => parseInt(x, 16))),
        iterations: 125000,
        hash: 'SHA-256'
      }, key, 256);
      return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    const randomSalt = () => [...crypto.getRandomValues(new Uint8Array(16))].map(x => x.toString(16).padStart(2, '0')).join('');
    function randomPassword() {
      const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#';
      let bytes = crypto.getRandomValues(new Uint8Array(12));
      return [...bytes].map(x => a[x % a.length]).join('');
    }

    async function setPassword(user, pass) {

      let salt = randomSalt(), hash = await hashPass(pass, salt);
      user.salt = salt;
      user.hash = hash;
      user.iter = 125000;
      user.status = 'active';
    }

              ...(r === 'admin' ? [['users','Usuarios'],['stores','Sucursales y Geocerca 100m'],['audit','Auditoría'],['backup','Respaldo / Limpieza']] : [])
            ];
      return `<nav class="tabs" aria-label="Secciones">${a.map(([key,label]) => `<button class="tab ${TAB===key?'active':''}" onclick="go('${key}')">${label}</button>`).join('')}</nav>`;
    }

    function go(t) {
      TAB = t;
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function shell() {
      const demoToolbar = IS_DEMO_SESSION ? `
        <div class="demoBar">
          <div class="flex center gap8 wrap">
            <span class="chip amber">MODO DEMOSTRACIÓN (DEMO.1ADMIN)</span>
            <span>Simulador GPS:</span>
            <button class="btn small ${SIM_DISTANCE_M <= 100 ? 'green' : 'ghost'}" onclick="SIM_DISTANCE_M=18;toast('GPS simulado: 18m (Dentro de tienda)');render()">En Tienda (18m)</button>
            <button class="btn small ${SIM_DISTANCE_M > 100 ? 'red' : 'ghost'}" onclick="SIM_DISTANCE_M=450;toast('GPS simulado: 450m (Fuera de rango >100m)');render()">Fuera (450m)</button>
          </div>
          <div class="flex center gap8 wrap">
            <span>Cambiar rol en vivo:</span>
            <button class="btn small soft" onclick="quickDemoSwitch('PROMO1.GDL')">Promotor</button>
            <button class="btn small soft" onclick="quickDemoSwitch('SUPER1.ISRAEL')">Sup. Israel</button>
            <button class="btn small soft" onclick="quickDemoSwitch('SUPER2.JONA')">Sup. Jonathan</button>
            <button class="btn small soft" onclick="quickDemoSwitch('VENTAS1.MOSS')">Ejecutivo</button>
            <button class="btn small amber" onclick="quickDemoSwitch('ADMIN1.MOSS')">Admin</button>
          </div>
        </div>
      ` : '';

      return `
        ${demoToolbar}
        <div class="appHeader">
          <div class="headerBrand">
            <img src="${ICON}" class="appLogo" width="44" height="44" alt="ColchoCheck"/>
            <div>
              <div class="brand-name">ColchoCheck</div>
              <div class="sub">• SUPER COLCHONES (GNC) · COLCHONES AMÉRICA •</div>
            </div>
          </div>
          <div class="headerRight">
            <span class="chip black hideMobile">${E(roles[USER.role])} · ${E(USER.credencial || '')}</span>
            <span class="small hideMobile" style="color:#d3e0ed">${E(USER.name)} (${E(USER.id)})</span>
            <button class="btn small ghost" onclick="session(null)">Salir</button>
          </div>
        </div>
        <main class="view">
          ${tabs()}
          <div id="screen"></div>
          <div class="appFooter">ColchoCheck · Super Colchones (GNC) · Corte Sell-Out: ${E(STATE.cutoffDate)} · Modo ahorro de datos móviles</div>
        </main>
      `;
    }

    function heading(t, sub = '', other = '') {
      return `<div class="head"><div><div class="caps muted">${E(roles[USER.role])} · ${E(today())}</div><h1>${t}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${other}</div>`;
    }

    function status(st) {
      let m = {
        scheduled: ['Pendiente', 'amber'],
        active: ['En Piso / Curso', 'green'],
        awaiting_report: ['Cierre Pendiente', 'amber'],
        complete: ['Cerrada', 'blue'],
        authorized: ['Autorizada Admin (No realizada)', 'red'],
        interrupted: ['Interrumpida · Autorizada', 'red']
      };
      let [lab, c] = m[st] || ['Pendiente', 'amber'];
      return `<span class="chip ${c}">${lab}</span>`;
    }

    function readOwn(a) {
      if (allowed('admin','direccion','gerencia','ejecutivo')) return true;
      if (USER.role === 'supervisor') return a.userId === USER.id || sel(a.userId)?.supervisorId === USER.id;
      return a.userId === USER.id;
    }
    function readVisits(v) {
      if (allowed('admin','direccion','gerencia','ejecutivo')) return true;
      if (USER.role === 'supervisor') return v.userId === USER.id || sel(v.userId)?.supervisorId === USER.id;
      return v.userId === USER.id;
    }
    function permittedAssign(u) {
      return USER.role === 'admin' || USER.role === 'ejecutivo' || (USER.role === 'supervisor' && sel(u)?.role === 'promotor' && sel(u)?.supervisorId === USER.id);
    }
    function canApprove(a) {
      return a && (['admin','ejecutivo'].includes(USER.role) || (USER.role === 'supervisor' && sel(a.userId)?.role === 'promotor' && sel(a.userId)?.supervisorId === USER.id));
    }
    function scheduleFor(userId, date = today()) {
      return STATE.assignments.filter(a => a.userId === userId && a.date === date);
    }
    function latestVisit(aid) {
      return STATE.visits.find(v => v.assignmentId === aid);
    }
    function activeVisit(userId) {
      return STATE.visits.find(v => v.userId === userId && v.status === 'active');
    }
    function aState(a) {
      let v = latestVisit(a.id);
      return v ? v.status : a.status === 'authorized' ? 'authorized' : 'scheduled';
    }
    function visitTime(v) {
      return v?.checkIn && v?.checkOut
        ? dur(v.checkOut.at - v.checkIn.at - (v.breaks || []).reduce((sum, b) => sum + ((b.end || v.checkOut.at) - b.start), 0))
        : v?.checkIn && v.status === 'active'
          ? dur(Date.now() - v.checkIn.at - (v.breaks || []).reduce((sum, b) => sum + ((b.end || Date.now()) - b.start), 0))
          : '—';
    }

    function render() {
      if (!STATE) return;
      if (!USER) {
        $('root').innerHTML = loginView();
        return;
      }
      USER = sel(USER.id);
      if (!USER || USER.status !== 'active') {
        session(null);
        return;
      }
      $('root').innerHTML = shell();
      $('screen').innerHTML = USER.role === 'promotor'
        ? promScreens()
        : USER.role === 'supervisor'
          ? superScreens()
          : leadScreens();
      if (TAB === 'sales') fillSaleValues();
      renderClock();
    }

    function renderClock() {
      document.querySelectorAll('[data-timer]').forEach(el => {
        const v = STATE.visits.find(x => x.id === el.dataset.timer);
        if (v) el.textContent = visitTime(v);
      });
    }

    function userOptions(filter = () => true) {
      return STATE.users.filter(filter).map(u => `<option value="${E(u.id)}">${E(u.name)} · ${E(u.id)}</option>`).join('');
    }
    function storeOptions(filter = () => true) {
      return STATE.branches.filter(b => !b.closed && filter(b)).map(b => `<option value="${E(b.id)}">#${E(b.id)} · ${E(b.name)} (${E(b.area)})</option>`).join('');
    }
    function who(id) {
      let u = sel(id);
      return u ? E(u.name) + ' (' + E(u.id) + ')' : E(id);
    }

    // TARJETA DE OBJETIVO EN PIEZAS PARA PROMOTOR (OCULTA IMPORTES EN PESOS $)
    function goalCardPromotor(id) {
      let x = STATE.sales[id] || { goal: 0, sold: 0 };
      let g = Math.round(x.goal || 0), s = Math.round(x.sold || 0);
      let rem = Math.max(0, g - s);
      return `
        <div class="card pad" style="background:#102238;color:white;border:0">
          <div class="flex between center">
            <span class="caps" style="color:#7dd3fc">🎯 META Y AVANCE MENSUAL · SOLO PIEZAS</span>
            <span class="chip black" style="background:#1e3a5f;color:#fde68a">Corte Sell-Out: ${E(STATE.cutoffDate)}</span>
          </div>
          <div class="flex between center sp8">
            <div>
              <span style="font-size:28px;font-weight:850">${s}</span>
              <span class="small" style="color:#c2d3e4"> / ${g} piezas facturadas</span>
            </div>
            <span class="bold" style="font-size:18px;color:#34d399">${pct(s, g)}</span>
          </div>
          <div class="progress sp8">
            <span style="width:${g > 0 ? Math.min(100, (100 * s) / g) : 0}%"></span>
          </div>
          <div class="micro sp8" style="color:#cbd5e1">
            ${rem > 0 ? `Faltan ${rem} piezas para cumplir la meta mensual de la tienda #${E(id)}.` : `¡Objetivo de piezas cumplido en tienda #${E(id)}!`} (Información oficial inalterable por promotoría).
          </div>
        </div>
      `;
    }

    // =========================================================================
    // MÓDULO 1: PANTALLAS DEL PROMOTOR (FLUJO SECUENCIAL + GEOCERCA 100M + COMIDA 60M)
    // =========================================================================
    function promScreens() {
      const a = STATE.assignments.filter(x => x.userId === USER.id && x.date === today()).sort((x, y) => x.createdAt - y.createdAt);
      const v = activeVisit(USER.id);
      const outstanding = STATE.visits.find(x => x.userId === USER.id && x.status === 'awaiting_report');

      if (TAB === 'role') {
        return heading('Mi rol asignado', 'Sucursales programadas por tu supervisor') +
          `<div class="card pad"><div class="g12">${[...STATE.assignments.filter(x => x.userId === USER.id)].sort((x, y) => y.date.localeCompare(x.date)).slice(0, 60).map(assignmentRow).join('') || '<div class="empty">Sin rol cargado. Solicita asignación a tu supervisor.</div>'}</div></div>`;
      }
      if (TAB === 'history') {
        return heading('Mi historial', 'Visitas registradas con tiempo efectivo en piso') +
          `<div class="card pad">${STATE.visits.filter(x => x.userId === USER.id).sort((x, y) => y.createdAt - x.createdAt).map(visitRow).join('') || '<div class="empty">Aún no has registrado visitas.</div>'}</div>`;
      }

      const next = a.find(x => aState(x) === 'scheduled');
      const now = v?.assignmentId ? STATE.assignments.find(x => x.id === v.assignmentId) : (next || a.find(x => aState(x) === 'awaiting_report'));
      const id = now?.branchId;
      const bObj = id ? branch(id) : null;

      return heading('Mi jornada en piso', 'Horario flexible por bolsa de horas efectivas · Geocerca 100m', status(v ? 'active' : outstanding ? 'awaiting_report' : 'scheduled')) + `
        <div class="two">
          <div class="stack">
            <div class="card pad">
              <div class="caps muted">Sucursal Asignada Hoy</div>
              <h2 style="font-size:22px;letter-spacing:-.035em;margin:7px 0">${id ? bn(id) : 'Sin asignación para hoy'}</h2>
              <div class="small muted">
                ${bObj ? `Coordenadas Tienda: ${bObj.lat.toFixed(4)}, ${bObj.lng.toFixed(4)} · Geocerca: ${bObj.geofenceActive ? '100m Activa' : 'Libre'}` : 'Solicita a tu supervisor asignar tu tienda del día.'}
              </div>
            </div>
            ${id ? goalCardPromotor(id) : ''}
            <div class="card pad">
              <h2 class="section-title">Tiempo Efectivo en Sucursal</h2>
              <div class="bigTimer">
                <div class="caps" style="color:#afd0e8">${v ? 'TURNO EN PISO ACTIVO' : 'ESPERANDO ENTRADA EN PISO'}</div>
                <div class="time mono" ${v ? `data-timer="${v.id}"` : ''}>${v ? visitTime(v) : '00:00:00'}</div>
                <div class="tiny">Bolsa flexible: Si llegas con retraso se compensa automáticamente al cierre de tu jornada.</div>
              </div>
              <div class="actionGrid sp16">
                <button class="btn green" ${!next || v || outstanding ? 'disabled' : ''} onclick="startCapture('in','${next?.id || ''}')">📷 REGISTRAR ENTRADA</button>
                <button class="btn red" ${!v ? 'disabled' : ''} onclick="startCapture('out','${v?.assignmentId || ''}')">🏁 REGISTRAR SALIDA</button>
              </div>
              ${v ? `<button class="btn amber wide sp12" onclick="toggleBreak()">${v.breaks?.some(x => !x.end) ? '🍽️ Finalizar hora de comida y volver a piso' : '🍽️ Iniciar hora de comida (Máx. 60 min)'}</button>` : ''}
              <div class="field-help sp8">Si pasan más de 2 horas después de tu salida y olvidaste cerrar en tienda, el sistema permite el cierre extemporáneo marcando la nota de ubicación.</div>
            </div>
          </div>
          <div class="stack">
            <div class="card pad">
              <h2 class="section-title">Comentarios de Fin de Día (Cierre de Visita)</h2>
              ${outstanding ? reportForm(outstanding) : '<div class="note warn">🔒 Los comentarios de fin de día se desbloquean únicamente posterior al cierre de tu visita (Salida registrada).</div>'}
            </div>
            <div class="card pad">
              <h2 class="section-title">Tu Rol de Hoy</h2>
              ${a.length ? a.map(assignmentRow).join('') : '<div class="empty">Sin visitas programadas para hoy.</div>'}
            </div>
          </div>
        </div>
      `;
    }

    function assignmentRow(a) {
      return `<div class="item"><div class="item-main"><div class="item-title">${bn(a.branchId)} ${a.classification ? `<span class="chip blue">${E(a.classification)}</span>` : ''}</div><div class="item-sub">${E(a.date)} · ${who(a.userId)}</div></div>${status(aState(a))}</div>`;
    }

    function visitRow(v) {
      return `
        <div class="item">
          <div class="item-main">
            <div class="item-title">${bn(v.branchId)} ${v.warrantyFolio ? `<span class="chip amber">Folio: ${E(v.warrantyFolio)}</span>` : ''}</div>
            <div class="item-sub">
              ${who(v.userId)} · ${E(v.date)} · Entrada ${fmt(v.checkIn?.at)} · Salida ${fmt(v.checkOut?.at)} · Estancia: <b>${visitTime(v)}</b>
              ${v.transitMin ? ` · Traslado: <b>${v.transitMin}m</b>` : ''}
              ${v.extemporaneous ? ' · <b style="color:#b63e4c">⚠️ CIERRE FUERA DE RANGO (+2H)</b>' : ''}
            </div>
          </div>
          <div class="pill-btns">
            ${status(v.status)}
            <button class="btn small ghost" onclick="openVisit('${v.id}')">Detalle / Fotos</button>
          </div>
        </div>
      `;
    }

    function reportForm(v) {
      return `
        <form onsubmit="event.preventDefault();saveReport('${v.id}')" class="g12">
          <div class="note ok">Salida registrada a las ${fmt(v.checkOut?.at)} en ${bn(v.branchId)}. Completa los 6 indicadores:</div>
          <div>
            <label class="field-label" for="flow">• Afluencia (Opción precargada)</label>
            <select id="flow" class="field">
              <option>Nula</option>
              <option>Baja</option>
              <option selected>Media</option>
              <option>Alta</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="clients">• Ingresos de clientes (1 al 9999)</label>
            <input type="number" id="clients" class="field" min="1" max="9999" step="1" value="15" required/>
          </div>
          ${[
            ['ventaAm','• Venta Colchones América (Máx 140 caracteres)'],
            ['ventaComp','• Ventas Competencia (Máx 140 caracteres)'],
            ['presAm','• 1 Presupuesto Colchones América (Máx 140 caracteres)'],
            ['presComp','• 1 Presupuesto Competencia (Máx 140 caracteres)']
          ].map(([id, label]) => `
            <div>
              <label class="field-label" for="${id}">${label}</label>
              <textarea id="${id}" class="field textarea" maxlength="140" rows="2" placeholder="Espacio libre de escritura (máx. 140 caracteres)..."></textarea>
            </div>
          `).join('')}
          <button class="btn primary wide" type="submit">Guardar Comentarios de Fin de Día</button>
        </form>
      `;
    }

    function saveReport(id) {
      let v = STATE.visits.find(x => x.id === id && x.userId === USER.id && x.status === 'awaiting_report');
      if (!v) return toast('No hay visita pendiente de reporte.');
      let n = Number($('clients').value);
      if (!Number.isInteger(n) || n < 1 || n > 9999) return toast('Ingresos de clientes: número entre 1 y 9999.');
      v.report = {
        flow: $('flow').value,
        clients: n,
        ventaAm: $('ventaAm').value.slice(0, 140),
        ventaComp: $('ventaComp').value.slice(0, 140),
        presAm: $('presAm').value.slice(0, 140),
        presComp: $('presComp').value.slice(0, 140),
        sentAt: Date.now()
      };
      v.status = 'complete';
      audit('REPORTE_FIN_DIA_PROMOTOR', `${USER.id} · Tienda #${v.branchId}`);
      save();
      render();
      toast('Comentarios de fin de día guardados.');
    }

    function toggleBreak() {
      let v = activeVisit(USER.id);
      if (!v) return;
      v.breaks = v.breaks || [];
      let openBreak = v.breaks.find(x => !x.end);
      if (openBreak) {
        openBreak.end = Date.now();
        const mins = Math.round((openBreak.end - openBreak.start) / 60000);
        if (mins > 60) {
          v.lunchExceeded = true;
          audit('ALERTA_COMIDA_EXCEDIDA', `${USER.id} excedió 60 min de comida (${mins} min)`);
        }
      } else {
        v.breaks.push({ start: Date.now(), end: null });
      }
      audit('HORA_COMIDA', `${USER.id} ${openBreak ? 'regresó de comida' : 'inició hora de comida (máx 60m)'}`);
      save();
      render();
    }

    // =========================================================================
    // MÓDULO 2: PANTALLAS DEL SUPERVISOR (COBERTURA DE CARTERA + GARANTÍAS 6 FOTOS + ORDEN LIBRE)
    // =========================================================================
    function getSupervisorCoverageStats(supId) {
      const myBranches = STATE.branches.filter(b => !b.closed && b.supervisorId === supId && b.supervisorName !== 'Sin Cobertura');
      const visited = myBranches.filter(b => b.visitedMonth);
      const pending = myBranches.filter(b => !b.visitedMonth);
      const locAll = myBranches.filter(b => b.area === 'Locales GDL');
      const locVis = locAll.filter(b => b.visitedMonth);
      const forAll = myBranches.filter(b => b.area !== 'Locales GDL');
      const forVis = forAll.filter(b => b.visitedMonth);

      let goalPieces = 0, soldPieces = 0, goalAmount = 0;
      myBranches.forEach(b => {
        const s = STATE.sales[b.id] || { goal: 0, sold: 0, amount: 0 };
        goalPieces += (s.goal || 0);
        soldPieces += (s.sold || 0);
        goalAmount += (s.amount || 0);
      });
      return {
        myBranches, visited, pending,
        locAll, locVis, forAll, forVis,
        goalPieces: Math.round(goalPieces),
        soldPieces: Math.round(soldPieces),
        goalAmount: Math.round(goalAmount)
      };
    }

    function superMiniDashboard(supId) {
      const st = getSupervisorCoverageStats(supId);
      return `
        <div class="three" style="margin-bottom:18px">
          <div class="card stat" style="background:#102238;color:white;border:0">
            <div class="flex between center">
              <span class="caps" style="color:#7dd3fc">SELL-OUT MI ZONA (PIEZAS)</span>
              <span class="micro" style="color:#fde68a">Corte: ${E(STATE.cutoffDate)}</span>
            </div>
            <b>${st.soldPieces} / ${st.goalPieces} pzas (${pct(st.soldPieces, st.goalPieces)})</b>
            <div class="micro sp8" style="color:#cbd5e1">Meta Informativa Zona: <span style="color:#34d399;font-weight:800">${fmtMXN(st.goalAmount)} MXN</span></div>
          </div>
          <div class="card stat">
            <div class="caps muted">COBERTURA DE MIS TIENDAS ASIGNADAS</div>
            <b>${st.visited.length} / ${st.myBranches.length} Visitadas</b>
            <div class="micro muted sp8">Faltan <b>${st.pending.length}</b> · Locales GDL: <b>${st.locVis.length}/${st.locAll.length}</b> · Foráneas: <b>${st.forVis.length}/${st.forAll.length}</b></div>
          </div>
          <div class="card stat">
            <div class="caps muted">REGLA DE RUTA Y APOYO</div>
            <div class="small sp8" style="line-height:1.45">
              Puedes abrir tus visitas del día en <b>orden libre</b> según tu traslado. Visitar tiendas de otra zona cuenta en tu trabajo del día como <b>Apoyo</b>, sin descontar tus ${st.pending.length} pendientes propias.
            </div>
          </div>
        </div>
      `;
    }

    function superScreens() {
      const supId = USER.id;
      const st = getSupervisorCoverageStats(supId);

      if (TAB === 'portfolio') {
        return heading('Mis Tiendas Asignadas', `Cartera oficial de ${USER.name} · Locales GDL y Foráneas`) +
          superMiniDashboard(supId) + `
          <div class="card pad">
            <div class="flex between center wrap gap8">
              <h2 class="section-title" style="margin:0">Estado de Visitas del Mes y Objetivos (Piezas + Importe Informativo)</h2>
              <span class="chip blue">Corte Sell-Out: ${E(STATE.cutoffDate)}</span>
            </div>
            <div class="table-scroll sp12">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>No_Tienda · Sucursal</th>
                    <th>Cobertura / Zona</th>
                    <th>Estado Visita Mes</th>
                    <th>Meta Piezas</th>
                    <th>Avance Piezas</th>
                    <th>% Avance</th>
                    <th>Objetivo Informativo ($)</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody>
                  ${st.myBranches.map(b => {
                    const sl = STATE.sales[b.id] || { goal: 0, sold: 0, amount: 0 };
                    return `
                      <tr>
                        <td><b>#${E(b.id)} · ${E(b.name)}</b></td>
                        <td>${E(b.area)} · ${E(b.zona || '')}</td>
                        <td>${b.visitedMonth ? `<span class="chip green">✅ Visitada (${E(b.lastVisitDate || 'Mes')})</span>` : '<span class="chip amber">⏳ Pendiente de visitar</span>'}</td>
                        <td class="mono">${Math.round(sl.goal || 0)} pzas</td>
                        <td class="mono bold">${Math.round(sl.sold || 0)} pzas</td>
                        <td class="mono bold">${pct(sl.sold || 0, sl.goal || 0)}</td>
                        <td class="mono">${fmtMXN(sl.amount || 0)}</td>
                        <td><button class="btn small soft" onclick="quickAddBranchStop('${E(b.id)}')">+ Agregar a ruta hoy</button></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (TAB === 'team') return teamScreen();
      if (TAB === 'closure') return closureScreen();
      if (TAB === 'history') {
        return heading('Historial de Supervisión', 'Visitas a sucursales, tiempos de traslado y folios de garantía') +
          `<div class="card pad">${STATE.visits.filter(v => v.userId === USER.id).sort((a, b) => b.createdAt - a.createdAt).map(visitRow).join('') || '<div class="empty">Sin visitas registradas.</div>'}</div>`;
      }

      let a = scheduleFor(USER.id);
      let active = activeVisit(USER.id);
      let n = a.filter(x => x.type === 'supervisor').length;
      const otherStores = STATE.branches.filter(b => !b.closed && b.supervisorId !== supId);

      return heading('Mi ruta de supervisión', 'Carga hasta 10 visitas por día (Sucursales o Folios de Garantía) y ábrelas en orden libre', `<span class="chip blue">${n} / 10 visitas hoy</span>`) +
        superMiniDashboard(supId) + `

    function addSupervisorStop(kind) {
      if (!allowed('supervisor')) return;
      let a = scheduleFor(USER.id).filter(x => x.type === 'supervisor');
      if (a.length >= 10) return toast('Límite: máximo 10 visitas por día para el supervisor.');

      if (kind === 'Garantia') {
        const folio = ($('garFolioInput')?.value || '').trim().toUpperCase() || ('GAR-' + Math.floor(1000 + Math.random() * 9000));
        const ref = ($('garRefInput')?.value || '').trim() || 'Domicilio Cliente';
        STATE.assignments.push({
          id: uid(),
          type: 'supervisor',
          visitKind: 'Garantia',
          classification: 'Folio de Garantía (6 Fotos)',
          warrantyFolio: folio,
          userId: USER.id,
          date: today(),
          branchId: `GAR:${folio} (${ref})`,
          status: 'scheduled',
          createdAt: Date.now(),
          createdBy: USER.id
        });
        audit('PLAN_GARANTIA', `${USER.id} · ${folio}`);
        save();
        render();
        toast(`Folio de Garantía ${folio} agregado a tu ruta.`);
        return;
      }

      let branchId = $('supStore')?.value;
      if (!branchId) return toast('Selecciona una sucursal.');
      const b = branch(branchId);
      const isMine = b && b.supervisorId === USER.id && b.supervisorName !== 'Sin Cobertura';
      const clasif = isMine ? (b.visitedMonth ? 'Titular · Seguimiento' : 'Titular · Mi Zona Asignada') : 'Visita de Apoyo (Fuera de mi zona)';
      STATE.assignments.push({
        id: uid(),
        type: 'supervisor',
        visitKind: 'Sucursal',
        classification: clasif,
        userId: USER.id,
        date: today(),
        branchId,
        status: 'scheduled',
        createdAt: Date.now(),
        createdBy: USER.id

    let ACTIVE_WARRANTY_SLOT = 0;
    let ACTIVE_WARRANTY_ASSIGN_ID = '';
    function triggerWarrantyPhotoSlot(slotIdx, assignId) {
      ACTIVE_WARRANTY_SLOT = slotIdx;
      ACTIVE_WARRANTY_ASSIGN_ID = assignId;
      const inp = $('warrantyGalleryInput');
      if (inp) {
        inp.value = '';
        inp.click();
      }
    }

    async function handleWarrantySlotFile(inp) {
      const a = STATE.assignments.find(x => x.id === ACTIVE_WARRANTY_ASSIGN_ID);
      const v = latestVisit(ACTIVE_WARRANTY_ASSIGN_ID);
      if (!a || !v) return;
      const f = inp.files?.[0];
      if (!f) return;
      try {
        let bmp = await createImageBitmap(f);
        let w = Math.min(720, bmp.width), h = Math.round((w * bmp.height) / bmp.width);
        let c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        c.getContext('2d').drawImage(bmp, 0, 0, w, h);
        let blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.65));
        let pid = await storePhoto(blob);
        WARRANTY_TEMP_PHOTOS[ACTIVE_WARRANTY_SLOT] = pid;
        v.warrantyPhotos = WARRANTY_TEMP_PHOTOS;
        save();
        renderWarrantyModalContent(a, v);
        toast(`Foto #${ACTIVE_WARRANTY_SLOT + 1} guardada y comprimida.`);
      } catch (e) {
        toast('Error al adjuntar imagen: ' + e.message);
      }
    }

    function completeWarrantyVisit(assignId) {
      const a = STATE.assignments.find(x => x.id === assignId);
      const v = latestVisit(assignId);
      if (!a || !v) return;
      const folio = ($('wFolioConfirm')?.value || '').trim() || a.warrantyFolio || 'GAR-VERIFICADO';
      const dictamen = $('wDictamenSelect')?.value || 'Procede Garantía';
      const countDone = WARRANTY_TEMP_PHOTOS.filter(Boolean).length;
      if (countDone < 6 && STATE.mode !== 'test') {
        return toast(`Faltan ${6 - countDone} fotografías del producto para cerrar el folio de garantía.`);
      }
      v.warrantyFolio = folio;
      v.warrantyDictamen = dictamen;
      v.warrantyPhotos = WARRANTY_TEMP_PHOTOS;
      v.checkOut = { at: Date.now(), lat: v.checkIn?.lat || 20.67, lng: v.checkIn?.lng || -103.35, accuracy: 15, photoId: WARRANTY_TEMP_PHOTOS[0] || null };
      v.status = 'complete';
      audit('CIERRE_GARANTIA', `${USER.id} · Folio ${folio} · ${dictamen}`);
      save();
      closeModal();
      render();
      toast(`Visita de Garantía (${folio}) cerrada exitosamente.`);
    }

    function upsertPromSchedule(source) {
      if (!allowed('admin','supervisor','ejecutivo')) return;
      let p = source === 'team' ? 'team' : 'admin';
      let userId = $(p + 'User').value, branchId = $(p + 'Store').value, date = $(p + 'Date').value;
      if (!date || !branchId) return toast('Selecciona fecha y sucursal.');
      let existing = STATE.assignments.find(a => a.userId === userId && a.date === date && a.type === 'promotor' && aState(a) === 'scheduled');
      if (existing) {
        existing.branchId = branchId;
        existing.updatedBy = USER.id;
        existing.updatedAt = Date.now();
      } else {
        STATE.assignments.push({
          id: uid(),
          type: 'promotor',
          userId,
          date,
          branchId,
          status: 'scheduled',
          createdAt: Date.now(),
          createdBy: USER.id
        });
      }
      audit('ROL_PROMOTOR', `${userId} · ${date} · Tienda #${branchId}`);
      save();
      render();
      toast(`Rol asignado a ${userId} en tienda #${branchId}.`);

    function processMasterExcelFile(inp) {
      if (!allowed('admin','ejecutivo')) return;
      const file = inp.files?.[0];
      if (!file) return;
      const newCutoff = ($('cutoffDateInput')?.value || '').trim() || STATE.cutoffDate;
      STATE.cutoffDate = newCutoff;

      if (typeof XLSX === 'undefined') {
        save();
        render();
        return toast('Fecha de corte actualizada a ' + newCutoff);
      }

      const reader = new FileReader();
      reader.onload = e => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          let countObj = 0, countAv = 0;

          wb.SheetNames.forEach(sName => {
            const up = sName.toUpperCase();
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sName], { header: 1, defval: null });

            if (up.includes('OBJETIVO')) {
              rows.forEach(r => {
                if (!r || r.length < 3) return;
                const noT = parseInt(r[0], 10);
                if (!isNaN(noT)) {
                  const id = String(noT);
                  const nom = String(r[1] || STATE.sales[id]?.name || `Tienda #${id}`).trim();
                  const pzas = parseFloat(r[2] || 0);
                  let imp = parseFloat(r[3] || 0);
                  if (noT === 318 && imp > 1000000) imp = 12500;
                  if (!STATE.sales[id]) STATE.sales[id] = { name: nom, goal: 0, sold: 0, amount: 0 };
                  if (!isNaN(pzas)) STATE.sales[id].goal = Math.round(pzas * 10) / 10;
                  if (!isNaN(imp)) STATE.sales[id].amount = Math.round(imp * 100) / 100;
                  countObj++;
                }
              });
            }

            if (up.includes('AVANCE')) {
              rows.forEach(r => {
                if (!r || r.length < 4) return;
                const c0 = parseInt(r[0], 10), c1 = parseInt(r[1], 10);
                const noT = !isNaN(c0) ? c0 : c1;
                const off = !isNaN(c0) ? 0 : 1;
                if (!isNaN(noT)) {
                  const id = String(noT);
                  const nom = String(r[off + 1] || STATE.sales[id]?.name || `Tienda #${id}`).trim();
                  const metaP = parseFloat(r[off + 2] || 0);
                  const avP = parseInt(r[off + 3] || 0, 10);
                  if (!STATE.sales[id]) STATE.sales[id] = { name: nom, goal: 0, sold: 0, amount: 0 };
                  if (!isNaN(metaP) && metaP > 0) STATE.sales[id].goal = Math.round(metaP * 10) / 10;
                  if (!isNaN(avP)) STATE.sales[id].sold = avP;
                  countAv++;
                }
              });
            }
          });

          audit('CARGA_EXCEL_MAESTRO', `Corte ${newCutoff} · ${countObj} objetivos · ${countAv} avances por No_Tienda`);
          save();
          render();
          toast(`Excel sincronizado por No_Tienda al corte ${newCutoff} (${countObj} metas / ${countAv} avances).`);
        } catch (err) {
          toast('Error procesando Excel: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function csvValue(x) {
      let s = String(x ?? '');
      if (/^[\s]*[=+@\-]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    }
    function dl(data, name, mime = 'text/plain;charset=utf-8') {
      let b = data instanceof Blob ? data : new Blob([data], { type: mime });
      let url = URL.createObjectURL(b), a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
    function csvRows(name, head, rows) {
      dl('\ufeff' + [head, ...rows].map(row => row.map(csvValue).join(',')).join('\r\n'), `ColchoCheck_${name}_${today()}.csv`, 'text/csv;charset=utf-8');
    }

    // =========================================================================
    // BASE DE DATOS INDEXEDDB PARA FOTOGRAFÍAS Y COMPARTIR POR WHATSAPP
    // =========================================================================
    function db() {
      if (dbp) return dbp;
      dbp = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(Error('IndexedDB no disponible'));
        let r = indexedDB.open(PHOTO_DB, 1);
        r.onupgradeneeded = () => {
          let d = r.result;
          if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
        };
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
      return dbp;
    }

    async function storePhoto(blob) {
      let d = await db(), id = uid();
      await new Promise((resolve, reject) => {
        let tx = d.transaction('photos', 'readwrite');
        tx.objectStore('photos').put({ id, blob, at: Date.now() });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      return id;
    }

    async function getPhoto(id) {
      let d = await db();
      return new Promise((resolve, reject) => {
        let tx = d.transaction('photos');
        let req = tx.objectStore('photos').get(id);
        req.onsuccess = () => resolve(req.result?.blob || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function listPhotos() {
      let d = await db();
      return new Promise((resolve, reject) => {
        let tx = d.transaction('photos');
        let q = tx.objectStore('photos').getAll();
        q.onsuccess = () => resolve(q.result || []);
        q.onerror = () => reject(q.error);
      });
    }

    async function clearPhotos() {
      let d = await db();
      return new Promise((resolve, reject) => {
        let tx = d.transaction('photos', 'readwrite');
        tx.objectStore('photos').clear();
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function putPhotoObj(obj) {
      let d = await db();
      return new Promise((resolve, reject) => {
        let tx = d.transaction('photos', 'readwrite');
        tx.objectStore('photos').put(obj);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        let reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function backupFull() {
      if (!allowed('admin')) return;
      try {
        let pics = await listPhotos(), photos = [];
        for (let p of pics) photos.push({ id: p.id, at: p.at, data: await blobToDataURL(p.blob) });
        let payload = { app: 'ColchoCheckUnifiedBackup', version: 6, exportedAt: Date.now(), state: STATE, photos };
        dl(JSON.stringify(payload), `ColchoCheck_Respaldo_${today()}.json`, 'application/json');
        toast(`Respaldo descargado con ${photos.length} fotografías.`);
      } catch (e) {
        toast('Error al generar respaldo: ' + e.message);
      }
    }

    function dataUrlBlob(u) {
      let [head, base64] = u.split(','), mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
      let bin = atob(base64), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    async function restoreFull() {
      if (!allowed('admin')) return;
      let f = $('restoreFile').files[0];
      if (!f) return toast('Selecciona un archivo .json');
      try {
        let raw = JSON.parse(await f.text());
        if (!raw.state?.users || !raw.state?.branches) throw Error('Archivo de respaldo incompatible.');
        await clearPhotos();
        for (let p of (raw.photos || [])) {
          if (typeof p.id === 'string' && typeof p.data === 'string' && p.data.startsWith('data:image/')) {
            await putPhotoObj({ id: p.id, blob: dataUrlBlob(p.data), at: p.at });
          }
        }
        STATE = raw.state;
        save();
        render();
        toast('Respaldo restaurado exitosamente.');
      } catch (e) {
        toast('No se pudo restaurar: ' + e.message);
      }
    }

    // =========================================================================
    // MODAL DE CAPTURA FOTOGRÁFICA + VALIDACIÓN DE GEOCERCA 100 METROS
    // =========================================================================
    function modal(html) {
      $('modalRoot').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
    }
    function closeModal() {
      stopStream();
      $('modalRoot').innerHTML = '';
      PHOTO = null; GPS = null; PENDING = null;
    }
    function stopStream() {
      if (STREAM) {
        STREAM.getTracks().forEach(x => x.stop());
        STREAM = null;
      }
    }

    function checkCaptureAllowed(kind, assignId) {
      let a = STATE.assignments.find(x => x.id === assignId);
      if (!a || a.userId !== USER.id || a.date !== today()) return null;
      let v = latestVisit(assignId);
      if (kind === 'in') {
        if (aState(a) !== 'scheduled' || activeVisit(USER.id)) return null;
        if (USER.role === 'promotor' && STATE.visits.some(x => x.userId === USER.id && x.status === 'awaiting_report')) return null;
      } else if (kind === 'out') {
        if (!v || v.status !== 'active') return null;
      }
      return a;
    }

    function startCapture(kind, assignId) {
      let a = checkCaptureAllowed(kind, assignId);
      if (!a) return toast('Verifica que no tengas otra visita abierta o un cierre pendiente.');
      PHOTO = null; GPS = null; PENDING = { kind, assignId };
      const bObj = branch(a.branchId);
      const fenceNote = bObj && bObj.geofenceActive
        ? `Geocerca Activa (≤ 100m de #${bObj.id} ${bObj.name}: ${bObj.lat.toFixed(4)}, ${bObj.lng.toFixed(4)})`
        : 'Ubicación GPS libre (Domicilio Garantía / Sin Geocerca)';

      modal(`
        <h2>${kind === 'in' ? '📷 Registrar Entrada' : '🏁 Registrar Salida'}</h2>
        <p class="small muted">${who(USER.id)} · ${bn(a.branchId)}</p>
        <div class="note sp8">${E(fenceNote)}</div>
        <div class="camera-frame" id="camFrame"><video autoplay muted playsinline id="liveVideo"></video></div>
        <img id="capturedImg" class="proof-preview hidden" alt="Vista previa de selfie"/>
        <div class="pill-btns sp12">
          <button class="btn small primary" onclick="beginCamera()">1. Abrir cámara en vivo</button>
          <button class="btn small green" onclick="takePhoto()">2. Tomar fotografía</button>
          <button class="btn small soft" onclick="$('fallbackInput').click()">📱 Usar Cámara Nativa del Celular</button>
          <input type="file" accept="image/*" capture="user" id="fallbackInput" class="hidden" onchange="fileCaptured(this)"/>
        </div>
        <div class="note sp12" id="photoResult">Paso 1: Toma tu fotografía en piso de venta.</div>
        <button class="btn ghost wide sp12" onclick="requestGeo()">📍 Paso 2: Validar Ubicación GPS</button>
        <div class="note sp12" id="geoResult">GPS pendiente de validar.</div>
        <button class="btn green wide sp16" onclick="commitCapture(false)">Confirmar ${kind === 'in' ? 'Entrada' : 'Salida'}</button>
        ${ (IS_DEMO_SESSION || STATE.mode === 'test') ? `<button class="btn amber wide sp12" onclick="commitCapture(true)">🧪 Simular Captura Rápida (${SIM_DISTANCE_M}m de sucursal)</button>` : '' }
        <button class="btn ghost wide sp8" onclick="closeModal()">Cancelar</button>
      `);
      beginCamera();
      requestGeo();
    }

    async function beginCamera() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw Error('Usa el botón "Usar Cámara Nativa del Celular".');
        stopStream();
        STREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 } }, audio: false });
        if ($('liveVideo')) {
          $('liveVideo').srcObject = STREAM;
          await $('liveVideo').play();
          $('photoResult').textContent = '✅ Cámara activa. Toca "2. Tomar fotografía".';
        }
      } catch (e) {
        if ($('photoResult')) $('photoResult').textContent = 'Toca el botón "📱 Usar Cámara Nativa del Celular" arriba.';
      }
    }

    function takePhoto() {
      let v = $('liveVideo');
      if (!STREAM || !v?.videoWidth) return toast('Primero abre la cámara o usa el botón de Cámara Nativa.');
      let c = document.createElement('canvas'), w = 640, h = Math.max(360, Math.round((640 * v.videoHeight) / v.videoWidth));
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(v, 0, 0, w, h);
      c.toBlob(blob => { PHOTO = blob; showCaptured(blob); stopStream(); }, 'image/jpeg', 0.6);
    }

    async function fileCaptured(inp) {
      let f = inp.files?.[0];
      if (!f) return;
      try {
        let bmp = await createImageBitmap(f);
        let w = Math.min(640, bmp.width), h = Math.round((w * bmp.height) / bmp.width), c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(bmp, 0, 0, w, h);
        PHOTO = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.6));
        showCaptured(PHOTO);
        stopStream();
      } catch (e) {
        toast('Error al procesar foto: ' + e.message);
      }
    }

    function showCaptured(blob) {
      let img = $('capturedImg'), url = URL.createObjectURL(blob);
      img.src = url;
      img.onload = () => URL.revokeObjectURL(url);
      img.classList.remove('hidden');
      $('camFrame').classList.add('hidden');
      $('photoResult').textContent = '✅ Fotografía lista y comprimida (<80 KB).';
    }

    function requestGeo() {
      let el = $('geoResult');
      if (!el) return;
      if (!navigator.geolocation) {
        el.textContent = 'GPS no soportado en este navegador.';
        return;
      }
      el.textContent = 'Obteniendo coordenadas satelitales...';
      navigator.geolocation.getCurrentPosition(p => {
        const a = PENDING ? STATE.assignments.find(x => x.id === PENDING.assignId) : null;
        const bObj = a ? branch(a.branchId) : null;
        const dist = bObj ? haversineMeters(p.coords.latitude, p.coords.longitude, bObj.lat, bObj.lng) : 0;
        GPS = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy, distanceMeters: dist };
        if ($('geoResult')) {
          $('geoResult').textContent = bObj
            ? `📍 GPS: ${GPS.lat.toFixed(5)}, ${GPS.lng.toFixed(5)} · Distancia a #${bObj.id} ${bObj.name}: ${dist}m`
            : `📍 GPS: ${GPS.lat.toFixed(5)}, ${GPS.lng.toFixed(5)} (±${Math.round(GPS.accuracy)}m)`;
        }
      }, e => {
        if ($('geoResult')) $('geoResult').textContent = 'Permiso GPS pendiente: ' + e.message;
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 12000 });
    }

    async function stampProof(blob, record) {
      let bmp = await createImageBitmap(blob), width = Math.min(720, bmp.width), height = Math.round((bmp.height * width) / bmp.width);
      let c = document.createElement('canvas');
      c.width = width; c.height = height;
      let x = c.getContext('2d');
      x.drawImage(bmp, 0, 0, width, height);
      let box = Math.max(78, Math.round(height * 0.22));
      x.fillStyle = 'rgba(0,0,0,.78)';
      x.fillRect(0, height - box, width, box);
      x.fillStyle = '#fff';
      x.font = `bold ${Math.max(13, Math.round(width * 0.024))}px system-ui`;
      let y = height - box + 24;
      for (const line of [
        `COLCHOCHECK · ${record.kind.toUpperCase()} · ${record.branch}`,
        `${record.date} ${record.time} · ${record.user}`,
        record.lat != null ? `GPS ${record.lat.toFixed(5)}, ${record.lng.toFixed(5)} (${record.distanceMeters ?? 0}m)` : 'REGISTRO SIMULADO EN DEMO'
      ]) {
        x.fillText(line, 14, y, width - 28);
        y += Math.max(18, Math.round(width * 0.03));
      }
      return new Promise(res => c.toBlob(res, 'image/jpeg', 0.65));
    }

    async function commitCapture(simulated) {
      if (!PENDING) return;
      let a = checkCaptureAllowed(PENDING.kind, PENDING.assignId);
      if (!a) return toast('El estado de la visita cambió.');

      const bObj = branch(a.branchId);
      const distMeters = simulated ? SIM_DISTANCE_M : (GPS?.distanceMeters ?? 0);
      const vExisting = latestVisit(a.id);
      const hoursElapsed = vExisting?.checkIn?.at ? ((Date.now() - vExisting.checkIn.at) / 3600000) : 0;

      // Validar Geocerca de 100 metros (Excepto en Folios de Garantía o Cierre Extemporáneo +2h después de salida)
      if (bObj && bObj.geofenceActive && a.visitKind !== 'Garantia') {
        if (PENDING.kind === 'in' && distMeters > 100) {
          return toast(`BLOQUEO DE GEOCERCA 100m: Te encuentras a ${distMeters}m de #${bObj.id} ${bObj.name}. Debes estar a menos de 100m del piso de venta.`);
        }
        if (PENDING.kind === 'out' && distMeters > 100 && hoursElapsed < 11) {
          return toast(`BLOQUEO ANTI-AUSENTISMO: Estás a ${distMeters}m fuera de la tienda. Solo puedes cerrar fuera de geocerca si pasaron +2 horas después de tu horario de salida.`);
        }
      }

      if (!simulated && (!PHOTO || !GPS)) return toast('Completa la fotografía y la lectura de GPS antes de confirmar.');

      let at = Date.now(), proofId = null;
      let ev = {
        at,
        lat: simulated ? (bObj?.lat || 20.6628) : GPS.lat,
        lng: simulated ? (bObj?.lng || -103.3215) : GPS.lng,
        accuracy: simulated ? 15 : GPS.accuracy,
        distanceMeters: distMeters,
        photoId: null,
        simulated
      };

      try {
        if (!simulated && PHOTO) {
          let stamped = await stampProof(PHOTO, {
            kind: PENDING.kind === 'in' ? 'entrada' : 'salida',
            branch: bn(a.branchId),
            date: dateLabel(at),
            time: fmt(at),
            user: USER.id,
            ...ev
          });
          proofId = await storePhoto(stamped);
          ev.photoId = proofId;
        }

        if (PENDING.kind === 'in') {
          // Calcular tiempo de traslado si es supervisor y ya cerró una visita antes hoy
          let transitMin = 0;
          if (USER.role === 'supervisor') {
            const prevClosed = STATE.visits
              .filter(x => x.userId === USER.id && x.date === today() && x.checkOut?.at)
              .sort((x, y) => y.checkOut.at - x.checkOut.at)[0];
            if (prevClosed) {
              transitMin = Math.max(1, Math.round((at - prevClosed.checkOut.at) / 60000));
            }
          }

          STATE.visits.push({
            id: uid(),
            assignmentId: a.id,
            userId: USER.id,
            branchId: a.branchId,
            visitKind: a.visitKind || 'Sucursal',
            classification: a.classification || '',
            warrantyFolio: a.warrantyFolio || '',
            role: USER.role,
            date: today(),
            createdAt: at,
            status: 'active',
            transitMin,
            checkIn: ev,
            checkOut: null,
            breaks: [],
            report: null,
            simulated: !!simulated
          });
          audit('ENTRADA_REGISTRADA', `${USER.id} · ${bn(a.branchId)} (${distMeters}m)`);
        } else {
          const v = latestVisit(a.id);
          if (v.breaks?.some(b => !b.end)) v.breaks.find(b => !b.end).end = at;
          v.checkOut = ev;
          v.extemporaneous = (distMeters > 100 && hoursElapsed >= 11);
          v.status = USER.role === 'promotor' ? 'awaiting_report' : 'complete';
          v.simulated = !!(v.simulated || simulated);

          // Si es supervisor cerrando una sucursal de su propia cartera, marcarla como Visitada en el mes
          if (USER.role === 'supervisor' && bObj && bObj.supervisorId === USER.id && bObj.supervisorName !== 'Sin Cobertura') {
            bObj.visitedMonth = true;
            bObj.lastVisitDate = STATE.cutoffDate || today();
          }

          audit('SALIDA_REGISTRADA', `${USER.id} · ${bn(a.branchId)}${v.extemporaneous ? ' (EXTEMPORÁNEA FUERA DE RANGO)' : ''}`);
        }

        save();
        closeModal();
        render();
        toast(PENDING?.kind === 'in' ? 'Entrada registrada correctamente.' : 'Salida registrada correctamente.');
      } catch (e) {
        toast('Error al guardar: ' + e.message);
      }
    }

    function initialBoot() {
      load();
      render();
      setInterval(renderClock, 1000);
    }
    initialBoot();
  </script>
</body>
</html>
