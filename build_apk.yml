name: Compilar APK ColchoCheck

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    name: Generar APK Android con Icono Oficial
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Instalar Flutter Estable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Crear proyecto Android e inyectar main.dart e Icono Oficial
        run: |
          mkdir -p /tmp/app_colchocheck
          cd /tmp/app_colchocheck
          flutter create . --project-name colchocheck --org com.supercolchones.colchocheck

          # Localizar main.dart sin importar en qué carpeta se subió
          FOUND_MAIN=$(find "$GITHUB_WORKSPACE" -name "main.dart" | head -n 1)
          if [ -n "$FOUND_MAIN" ]; then
            echo "Usando main.dart encontrado en: $FOUND_MAIN"
            cp "$FOUND_MAIN" lib/main.dart
          else
            echo "ERROR: No se encontró main.dart en el repositorio"
            exit 1
          fi

          # Inyectar el nuevo icono oficial en todas las carpetas mipmap de Android
          python3 - << 'PYICON'
          import base64, glob, os
          icon_b64 = ""
          data = base64.b64decode(icon_b64)
          for folder in glob.glob("android/app/src/main/res/mipmap-*"):
              target = os.path.join(folder, "ic_launcher.png")
              with open(target, "wb") as f:
                  f.write(data)
              print("Icono actualizado en:", target)
          PYICON

          flutter pub get

      - name: 5. Compilar archivo APK Release
        run: |
          cd /tmp/app_colchocheck
          flutter build apk --release --no-tree-shake-icons

      - name: 6. Entregar Instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: ColchoCheck-APK-Listo
          path: /tmp/app_colchocheck/build/app/outputs/flutter-apk/app-release.apk
